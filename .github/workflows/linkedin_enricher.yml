# .github/workflows/linkedin_enricher.yml
name: Enriquecedor LinkedIn — tipo_contrato

on:
  # Roda quando o LinkedIn ADV termina (com sucesso ou não), para não gravar
  # na mesma rota enquanto a coleta ainda está em andamento.
  workflow_run:
    workflows: ["Scraper LinkedIn — ADV"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# DEV, ADV e enriquecedor gravam nas rotas do LinkedIn: um de cada vez.
# Um disparo manual simultâneo espera na fila em vez de rodar em paralelo.
concurrency:
  group: linkedin-firebase
  cancel-in-progress: false

jobs:
  enrich:
    name: Enriquecer tipo_contrato (DEV + ADV)
    runs-on: ubuntu-latest

    # Até 200 vagas por rota, uma página interna por vaga (~10-11s cada,
    # somando os dois delays): cerca de 75min para DEV + ADV. O teto corta
    # execução travada; a gravação é vaga a vaga, então o corte não perde dados.
    timeout-minutes: 120

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar arquivo de credenciais do Firebase
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          mkdir -p secrets
          echo "$FIREBASE_CREDENTIALS" > secrets/firebase_key.json

      - name: Executar enriquecedor LinkedIn
        env:
          FIREBASE_KEY_PATH: secrets/firebase_key.json
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: python main_linkedin_enricher.py

      - name: Upload do log (sempre, mesmo em falha)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enricher-linkedin-log
          path: scraper.log
          retention-days: 14