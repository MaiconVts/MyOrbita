name: Scraper LinkedIn — DEV

on:
  # Execução automática diária às 04:45 BRT (07:45 UTC)
  # Roda ~1h depois da Gupy para garantir isolamento entre execuções.
  schedule:
    - cron: '45 7 * * *'
  # Permite rodar manualmente via Actions → Run workflow
  workflow_dispatch:

permissions:
  contents: read

# DEV, ADV e enriquecedor gravam nas rotas do LinkedIn: um de cada vez.
# Um disparo manual simultâneo espera na fila em vez de rodar em paralelo.
concurrency:
  group: linkedin-firebase
  cancel-in-progress: false

jobs:
  scrape:
    name: Executar scraper LinkedIn (DEV)
    runs-on: ubuntu-latest

    # Uma requisição por keyword (~6s de delay + ~8s de cooldown):
    # 87 keywords levam cerca de 25min. O teto corta execução travada.
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar arquivo de credenciais do Firebase
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          mkdir -p secrets
          echo "$FIREBASE_CREDENTIALS" > secrets/firebase_key.json

      - name: Executar scraper LinkedIn (DEV)
        env:
          FIREBASE_KEY_PATH: secrets/firebase_key.json
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: python main_linkedin_dev.py

      - name: Upload do log (sempre, mesmo em falha)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scraper-linkedin-dev-log
          path: scraper.log
          retention-days: 14