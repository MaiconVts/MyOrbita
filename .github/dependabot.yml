version: 2
updates:
  # Mantém as actions fixadas por SHA atualizadas (o comentário com a versão é atualizado junto).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Só propõe versão publicada há pelo menos 7 dias.
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Só propõe versão publicada há pelo menos 7 dias.
    cooldown:
      default-days: 7
